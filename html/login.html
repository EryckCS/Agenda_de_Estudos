<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgendaDeEstudos</title>
    <link rel="stylesheet" href="../css/login.css">
</head>

<body>

    <div id="main">
        <img src="../img/agenda_de_estudos.png" alt="Logo" height="130" width="330" >
        <p id="textAviso">Aperte na aba doque você deseja realizar</p>
        <br>
        <button id="btnLogin">Login</button>
        <button id="btnCadastro">Cadastrar</button>
        <hr>

        <div id="caixa-login">
            <form id="login" autocomplete="on" hidden>
                <label style="color:aliceblue" for="email">Email:</label>
                <input type="email" id="email" name="email">
                <br><br><br>
                <label style="color:aliceblue" for="pass">Senha:</label>
                <input type="pass" id="pass" name="password">
                <br><br>
                <input id="btnEntrar" type="submit" value="Entrar">
            </form>
        </div>

        <div id="caixa-cadastro">
            <form id="cadastro" hidden>
                <label for="email">Email:</label>
                <input type="email" id="email" name="email">
                <label for="pass">Senha:</label>
                <input type="pass" id="pass" name="password">
                <input type="submit" value="Cadastrar">
            </form>
        </div>
    </div>

    <script src="../js/login.js"></script>
</body>

</html>
