<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agenda de Estudos</title>
    <link rel="stylesheet" href="../css/login.css">
</head>

<body>
    <div id="main">
        <img src="../img/agenda_de_estudos.png" alt="Logo da Agenda de Estudos" height="130" width="330">
        <p id="textAviso">Escolha o que deseja fazer</p>

        <button id="btnLogin" type="button">Login</button>
        <button id="btnCadastro" type="button">Cadastrar</button>
        <hr>

        <div id="caixa-login">
            <form id="login" autocomplete="on" hidden>
                <h3>Login</h3>

                <div class="campo-login">
                    <label for="emailLogin">E-mail:</label>
                    <input type="email" id="emailLogin" name="email" required>
                </div>

                <div class="campo-login">
                    <label for="senhaLogin">Senha:</label>
                    <input type="password" id="senhaLogin" name="password" required>
                </div>

                <input id="btnEntrar" type="submit" value="Entrar">
            </form>
        </div>

        <div id="caixa-cadastro">
            <form id="cadastro" hidden>
                <h3>Cadastro</h3>

                <div class="campo-login">
                    <label for="nomeCadastro">Nome:</label>
                    <input type="text" id="nomeCadastro" name="name" required>
                </div>

                <div class="campo-login">
                    <label for="emailCadastro">E-mail:</label>
                    <input type="email" id="emailCadastro" name="email" required>
                </div>

                <div class="campo-login">
                    <label for="senhaCadastro">Senha:</label>
                    <input type="password" id="senhaCadastro" name="password" required>
                </div>

                <input id="btnSalvarCadastro" type="submit" value="Cadastrar">
            </form>
        </div>
    </div>

    <script src="../js/login.js"></script>
</body>

</html>
