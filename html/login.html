<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgendaDeEstudos</title>
</head>
<body>
    <div id="site">
        <div id="main">
            <img src="../img/agenda-de-estudos.png" alt="Logo">
            <p>Login para entrar em sua conta, cadastro para se cadastrar.</p>
            <h3>Login</h3>
            <h3>Cadastro</h3>
            <hr>

            <div id="caixa-login">
                <form id="login" class="ativo" autocomplete="on">
                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email">
                    <label for="pass">Senha:</label>
                    <input type="pass" id="pass" name="password">
                    <input type="submit" value="Entrar">
                </form>
            </div>

            <div id="caixa-cadastro">
                <form id="login" class="inativo">
                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email">
                    <label for="pass">Senha:</label>
                    <input type="pass" id="pass" name="password">
                    <input type="submit" value="Cadastrar">
                </form>
            </div>
        </div>
    </div>
</body>
</html>
