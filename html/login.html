<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgendaDeEstudos</title>
    <link rel="stylesheet" href="../css/index.css">
</head>

<body>

    <div id="main">
        <img src="../img/agenda_de_estudos.png" alt="Logo" height="130" width="330" >
        <br>
        <button id="btnLogin">Login</button>
        <button id="btnCadastro">Cadastrar</button>
        <hr>

        <div id="caixa-login">
            <form id="login" class="ativo" autocomplete="on">
                <label id="email" for="email">Email:</label>
                <input type="email" id="email" name="email">
                <br>
                <label id="senha" for="pass">Senha:</label>
                <input type="pass" id="pass" name="password">
                <br>
                <input type="submit" value="Entrar">
            </form>
        </div>

        <div id="caixa-cadastro">
            <form id="login" class="inativo">
                <label for="email">Email:</label>
                <input type="email" id="email" name="email">
                <label for="pass">Senha:</label>
                <input type="pass" id="pass" name="password">
                <input type="submit" value="Cadastrar">
            </form>
        </div>
    </div>

</body>

</html>
