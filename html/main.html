<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/main.css">
    <title>AgendaEstudos</title>
</head>

<body>

    <div id="nav">

        <img src="../img/agenda_de_estudos.png" alt="logo" width="300" height="100">

        <section id="usuario">
            <h3 id="nomeUsuario">Eryck Kayck</h3>
            <p id="emailUsuario">eryck@gmail.com</p>
            <button id="btnSair">Sair</button>
        </section>

    </div>

    <div id="main">

        <div id="calendario">
            <h2>Calendário</h2>

            <section id="mes_calendario"></section>

            <button id="voltar">🢀</button>
            <button id="proximo">🢂</button>

            <section id="dias_semana">
                <div>Dom</div>
                <div>Seg</div>
                <div>Ter</div>
                <div>Qua</div>
                <div>Qui</div>
                <div>Sex</div>
                <div>Sáb</div>
            </section>

            <section id="dias"></section>
        </div>

        <div id="atividades-dia">

            <section id="cabecalho-atividades">

                <h2 id="titulo-dia">ATIVIDADES DO DIA</h2>

                <div id="barra-superior">

                    <div id="data-atual">
                        <span id="icone-data">📅</span>
                        <span id="texto-data"></span>
                    </div>

                    <button id="btnNovaAtividade" type="button">+ Nova Atividade</button>
                </div>

            </section>

            <form id="formAtividade" hidden>

                <div class="campos-atividade">

                    <div class="campo">
                        <label for="tituloAtividade">Título da atividade</label>
                        <input id="tituloAtividade" type="text" required>
                    </div>

                    <div class="campo">
                        <label for="descricaoAtividade">O que precisa fazer?</label>
                        <textarea id="descricaoAtividade" required></textarea>
                    </div>

                    <div class="campo">
                        <label for="dataAtividade">Data</label>
                        <input id="dataAtividade" type="date" required>
                    </div>

                    <div class="campo">
                        <label for="horaAtividade">Hora</label>
                        <input id="horaAtividade" type="time" required>
                    </div>

                </div>

                <div class="botoes-formulario">
                    <button type="submit">Salvar atividade</button>
                    <button id="btnCancelarAtividade" type="button">Cancelar</button>
                </div>

            </form>

            <div id="listaAtividades"></div>

        </div>

        <div id="pomodoro">

            <div id="cronometro">

                <h2>CRONÔMETRO POMODORO</h2>
                <span id="tempo">25:00</span>

                <div id="botoes">
                    <button id="btnIniciar">Iniciar</button>
                    <button id="btnPausar">Pausar</button>
                    <button id="btnResetar">Resetar</button>
                </div>

            </div>

            <div id="configuracoes">

                <div class="config">
                    <label for="tempoFoco">⏱ Tempo de estudo</label>
                    <input type="number" id="tempoFoco" min="1" value="25">
                </div>

                <div class="config">
                    <label for="tempoDescanso">☕ Descanso (auto)</label>
                    <input type="number" id="tempoDescanso" readonly>
                </div>
                
                <p id="observacao">* O tempo de descanso será calculado automaticamente.</p>
            </div>
        </div>
    </div>
    <script src="../js/main.js"></script>
</body>

</html>
