<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/main.css">
    <title>AgendaEstudos</title>
</head>

<body>

    <div id="nav">

        <img src="../img/agenda_de_estudos.png" alt="logo" width="300" height="100">

        <section id="usuario">
            <h3 id="nomeUsuario"></h3>
            <p id="emailUsuario"></p>
            <button id="btnSair" type="button">Sair</button>
        </section>

    </div>

    <div id="main">

        <div id="calendario">
            <h2>Calendário</h2>

            <section id="mes_calendario"></section>

            <button id="voltar">Voltar</button>
            <button id="proximo">Próximo</button>

            <section id="dias_semana">
                <div>Dom</div>
                <div>Seg</div>
                <div>Ter</div>
                <div>Qua</div>
                <div>Qui</div>
                <div>Sex</div>
                <div>Sáb</div>
            </section>

            <section id="dias"></section>
        </div>

        <div id="atividades-dia">

            <section id="cabecalho-atividades">

                <h2 id="titulo-dia">ATIVIDADES DO DIA</h2>

                <div id="barra-superior">

                    <div id="data-atual">
                        <span id="icone-data">📅</span>
                        <span id="texto-data"></span>
                    </div>

                    <button id="btnNovaAtividade" type="button">+ Nova Atividade</button>
                </div>

            </section>

            <form id="formAtividade" hidden>

                <div class="campos-atividade">

                    <div class="campo">
                        <label for="tituloAtividade">Título da atividade</label>
                        <input id="tituloAtividade" type="text" required>
                    </div>

                    <div class="campo">
                        <label for="descricaoAtividade">O que precisa fazer?</label>
                        <textarea id="descricaoAtividade" required></textarea>
                    </div>

                    <div class="campo">
                        <label for="dataAtividade">Data</label>
                        <input id="dataAtividade" type="date" required>
                    </div>

                    <div class="campo">
                        <label for="horaAtividade">Hora</label>
                        <input id="horaAtividade" type="time" required>
                    </div>

                </div>

                <div class="botoes-formulario">
                    <button type="submit">Salvar atividade</button>
                    <button id="btnCancelarAtividade" type="button">Cancelar</button>
                </div>

            </form>

            <div id="listaAtividades"></div>

        </div>

        <div id="pomodoro">

            <form id="cronometro">

                <h2>CRONÔMETRO POMODORO</h2>
                <div id="tempo">
                    <span id="hora">00</span>
                    <span id="minuto">00</span>
                    <span id="segundo">00</span>
                </div>

                <div id="botoes">
                    <button type="button" id="btnIniciar">Iniciar</button>
                    <button type="button" id="btnPausar">Pausar</button>
                    <button type="button" id="btnResetar">Resetar</button>
                </div>

            </form>

            <div id="configuracoes">

                <div id="escolhaNumero">
                    <h3>⏱ Tempo de estudo</h3>
                    <label for="tempoHora">Horas</label>
                    <input id="tempoHora" type="number" min="0" value="0">

                    <label for="tempoMinuto">Minutos</label>
                    <input id="tempoMinuto" type="number" min="0" max="59" value="0">

                    <label for="tempoSegundo">Segundos</label>
                    <input id="tempoSegundo" type="number" min="0" max="59" value="0">
                    <button type="submit" id="btnConfirmarTempo">Confirmar</button>

                </div>

                <div id="areaDescanso">
                    <h3>☕ Descanso: </h3>
                    <span id="tempoDescanso"></span>

                </div>

                <p id="observacao">* O tempo de descanso será calculado automaticamente.</p>
            </div>
        </div>
    </div>
    <script src="../js/atividades.js"></script>
    <script src="../js/cronometro.js"></script>
    <script src="../js/calendario.js"></script>
    <script src="../js/main.js"></script>
</body>

</html>
