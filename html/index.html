<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" type="text/css" href="../css/index.css">
    <title>AgendaFacil</title>
</head>

<body>
    <div id="main">
        <div id="calendario">
            <h2>Calendário</h2>
            <section id="mes_calendario">
            </section>
            <button id="voltar">Voltar</button>
            <button id="proximo">Próximo</button>

            <section id="dias_semana">
                <div>Dom</div>
                <div>Seg</div>
                <div>Ter</div>
                <div>Qua</div>
                <div>Qui</div>
                <div>Sex</div>
                <div>Sáb</div>
            </section>
            <section id="dias">
            </section>
        </div>
        <div id="atividades-dia">

            <section id="cabecalho-atividades">

                <h2 id="titulo-dia">ATIVIDADES DO DIA</h2>

                <div id="barra-superior">

                    <div id="data-atual">
                        <span id="icone-data">📅</span>
                        <span id="texto-data"></span>
                    </div>

                    <button id="btnNovaAtividade">+ Nova Atividade</button>

                </div>

            </section>

            <div id="listaAtividades">

            </div>

        </div>
        <div id="pomodoro">

            <h2>CRONÔMETRO POMODORO</h2>

            <div id="cronometro">

                <span id="tempo">25:00</span>

                <div id="botoes">
                    <button id="btnIniciar">Iniciar</button>
                    <button id="btnPausar">Pausar</button>
                    <button id="btnResetar">Resetar</button>
                </div>

                <p id="modoAtual">🎯 FOCO</p>
            </div>

            <div id="configuracoes">
                <div class="config">
                    <label for="tempoFoco">⏱ Tempo de estudo</label>
                    <input type="number" id="tempoFoco" min="1" value="25">
                </div>

                <div class="config">
                    <label for="tempoDescanso">☕ Descanso (auto)</label>

                    <input type="number" id="tempoDescanso" readonly>
                </div>
                <p id="observacao">* O tempo de descanso será calculado automaticamente.</p>
            </div>
        </div>
    </div>

    <div id="nav">
        <img src="../img/agenda-de-estudos.png" alt="logo" width="300" height="100">
        <section id="usuario">
            <h3 id="nomeUsuario">Eryck Kayck</h3>
            <p id="emailUsuario">eryck@gmail.com</p>
            <button id="btnSair">Sair</button>
        </section>
    </div>


</body>

</html>
